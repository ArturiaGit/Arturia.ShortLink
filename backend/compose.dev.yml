name: arturia-shortlink-dev

services:
  mysql:
    image: mysql:8.0.46
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      TZ: UTC
      MYSQL_DATABASE: ${MYSQL_DATABASE:-arturia_shortlink}
      MYSQL_USER: ${MYSQL_USER:-arturia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env.local 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env.local 中设置 MYSQL_ROOT_PASSWORD}
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - arturia_mysql_data:/var/lib/mysql

volumes:
  arturia_mysql_data:
